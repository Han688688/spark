# 组件交互描述模板
# 权威枚举值来源: docs/interaction_spec.md

metadata:
  template_version: "3.0"
  template_name: "组件交互描述模板"

interaction:
  name: ""
  components: []
  flow:
    - step: 1
      component: ""
      action: ""
      input: ""
      output: ""
      description: ""
      timeout: 0
      retry_count: 0
      branch: ""        # 可选 - 分支标识（多分支场景）
      loop: false        # 可选 - 循环标识（持续处理场景）
      loop_interval: ""  # 可选 - 循环间隔

data_schema:
  input_data:
    type: ""
    schema:
      fields:
        - name: ""
          type: ""
          nullable: false
  intermediate_data:
    type: ""
    schema: {}
  output_data:
    type: ""
    schema: {}

constraints:
  data_constraints:
    - name: ""
      type: ""  # 枚举: size / format / range / rate / null
      min: 0
      max: 0
      value: ""
  performance_constraints:
    - name: ""
      type: ""  # 枚举: latency / throughput / resource
      max_ms: 0
      min_qps: 0
  reliability_constraints:
    - name: ""
      type: ""  # 枚举: retry / guarantee / interval
      max: 0
      value: ""

example:
  interaction:
    name: "spark_kafka_hdfs_data_flow"
    components: ["Spark", "Kafka", "HDFS"]
    flow:
      - step: 1
        component: "HDFS"
        action: "provide_data"
        input: "/data/input"
        output: "RawDataFile"
        description: "HDFS提供原始数据文件"
      - step: 2
        component: "Spark"
        action: "read_from_hdfs"
        input: "RawDataFile"
        output: "DataFrame"
        description: "Spark读取HDFS数据为DataFrame"
      - step: 3
        component: "Spark"
        action: "process_data"
        input: "DataFrame"
        output: "ProcessedDataFrame"
        description: "Spark处理数据"
      - step: 4
        component: "Kafka"
        action: "produce_message"
        input: "ProcessedDataFrame"
        output: "kafka://topic/output"
        description: "Spark将结果发送到Kafka"
        timeout: 5000
        retry_count: 3

  data_schema:
    input_data:
      type: "JSON"
      schema:
        fields:
          - name: "id"
            type: "integer"
            nullable: false
          - name: "value"
            type: "float"
    output_data:
      type: "KafkaMessage"
      schema:
        key_field: "id"

  constraints:
    data_constraints:
      - name: "input_size"
        type: "size"
        min: 1
        max: 10000
      - name: "input_format"
        type: "format"
        value: "JSON"
    performance_constraints:
      - name: "processing_time"
        type: "latency"
        max_ms: 5000
    reliability_constraints:
      - name: "retry_count"
        type: "retry"
        max: 3