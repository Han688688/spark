# 种子用例：Spark-Kafka-HDFS数据管道
# 交互类型: data_flow（消息队列→流处理→文件存储）

metadata:
  seed_id: "001"
  scenario_name: "Kafka-Spark-HDFS数据管道"
  components: ["Kafka", "Spark", "HDFS"]
  interaction_type: "data_flow"

test_cases:
  - case_id: "seed-001-1"
    case_name: spark_kafka_hdfs_normal_flow_basic
    case_type: normal_flow
    priority: P0

    scenario:
      name: spark_kafka_hdfs_data_flow
      components: ["Kafka", "Spark", "HDFS"]
      interaction_type: data_flow
      description: Kafka消息经Spark Streaming处理后写入HDFS

    preconditions:
      - Kafka集群正常运行（3节点）
      - Spark Streaming应用已启动
      - HDFS目标目录已创建：/test/output

    test_steps:
      - step_number: 1
        action: produce_message
        component: Kafka
        input: 100条JSON消息发送到test_topic
        expected_result: 消息成功发送，offset增加100

      - step_number: 2
        action: consume_and_process
        component: Spark
        input: 从test_topic消费流数据
        expected_result: 成功消费100条消息，DataFrame包含100行

      - step_number: 3
        action: write_to_hdfs
        component: HDFS
        input: DataFrame写入/test/output目录
        expected_result: HDFS文件创建成功，包含100条记录

    test_data:
      input:
        data_size: 100
        data_format: JSON
      expected_output:
        status: success
        count: 100

    assertions:
      - assertion_type: value
        description: 验证Kafka消息发送成功
        expected_value: 100

      - assertion_type: count
        description: 验证Spark处理数量
        expected_value: 100

      - assertion_type: file
        description: 验证HDFS输出文件存在且非空
        expected_value: file_exists

    cleanup:
      - 删除Kafka Topic test_topic
      - 删除HDFS目录 /test/output
      - 删除Checkpoint目录 /test/checkpoint

  - case_id: "seed-001-2"
    case_name: spark_kafka_hdfs_error_handling_kafka_failure
    case_type: error_handling
    priority: P0

    scenario:
      name: spark_kafka_hdfs_data_flow
      error_type: kafka_connection_failure
      description: Kafka不可用时Spark的重试和异常处理机制

    preconditions:
      - Kafka集群停止运行
      - Spark应用已启动

    test_steps:
      - step_number: 1
        action: simulate_kafka_failure
        component: Kafka
        expected_result: Kafka集群停止

      - step_number: 2
        action: trigger_spark_processing
        component: Spark
        expected_result: Spark尝试连接Kafka

      - step_number: 3
        action: verify_retry_mechanism
        component: Spark
        expected_result: 触发重试机制，次数>=配置值

    test_data:
      input:
        data_size: 100
      expected_output:
        status: error
        count: 0

    assertions:
      - assertion_type: exception
        description: 验证连接异常被抛出
        expected_value: KafkaConnectionException

      - assertion_type: function
        description: 验证重试机制触发
        expected_value: retry_mechanism_triggered

    cleanup:
      - 恢复Kafka集群

  - case_id: "seed-001-3"
    case_name: spark_kafka_hdfs_boundary_values_min_data
    case_type: boundary_values
    priority: P1

    scenario:
      name: spark_kafka_hdfs_data_flow
      description: 测试最小数据量（1条）的处理流程

    preconditions:
      - Kafka正常运行
      - Spark应用已启动
      - HDFS目标目录已创建

    test_steps:
      - step_number: 1
        action: produce_message
        component: Kafka
        input: 1条JSON消息
        expected_result: 消息发送成功

      - step_number: 2
        action: consume_and_process
        component: Spark
        expected_result: 成功处理，DataFrame包含1行

      - step_number: 3
        action: write_to_hdfs
        component: HDFS
        expected_result: 文件创建，包含1条记录

    test_data:
      input:
        data_size: 1
        data_format: JSON
      expected_output:
        status: success
        count: 1

    assertions:
      - assertion_type: value
        description: 验证1条数据完整处理
        expected_value: 1

    cleanup:
      - 清理测试数据

  - case_id: "seed-001-4"
    case_name: spark_kafka_hdfs_boundary_values_max_data
    case_type: boundary_values
    priority: P1

    scenario:
      name: spark_kafka_hdfs_data_flow
      description: 测试大数据量（10000条）的处理性能

    preconditions:
      - Kafka正常运行
      - Spark应用已启动
      - HDFS目标目录已创建

    test_steps:
      - step_number: 1
        action: produce_message
        component: Kafka
        input: 10000条JSON消息
        expected_result: 批量发送成功

      - step_number: 2
        action: consume_and_process
        component: Spark
        expected_result: 批量处理完成

      - step_number: 3
        action: write_to_hdfs
        component: HDFS
        expected_result: 文件完整性校验通过

    test_data:
      input:
        data_size: 10000
        data_format: JSON
      expected_output:
        status: success
        count: 10000

    assertions:
      - assertion_type: function
        description: 验证大数据量处理完成
        expected_value: processing_completed_within_threshold

      - assertion_type: value
        description: 验证数据完整性
        expected_value: 10000

    cleanup:
      - 清理大数据

generalization_patterns:
  data_patterns:
    - "message_count: 1 -> 10 -> 100 -> 1000 -> 10000"
    - "data_format: JSON -> Avro -> Parquet"
    - "data_size: small -> medium -> large"
  
  error_patterns:
    - "component_failure: Kafka -> Spark -> HDFS"
    - "network_failure: connection_timeout -> network_disconnect -> DNS_failure"
    - "data_failure: format_error -> data_corruption -> data_missing"
  
  assertion_patterns:
    - "data_validation: count_match -> value_match -> format_match"
    - "file_validation: existence -> integrity -> permission"
    - "performance_validation: processing_time -> throughput -> resource_usage"