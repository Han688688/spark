# Skill主配置文件
# TestCaseGenerationSkill v3.0（文档驱动版）

metadata:
  skill_name: "TestCaseGenerationSkill"
  skill_version: "3.0.0"
  skill_description: "基于组件交互描述和种子用例自动生成测试用例（文档驱动）"
  created_date: "2026-05-20"

skill_info:
  name: "TestCaseGenerationSkill"
  type: "test_generation"
  author: "AI4SE"
  
  applicable_scenarios:
    - "组件交互测试"
    - "数据流测试"
    - "边界值测试"
    - "异常处理测试"
  
  not_applicable:
    - "API全覆盖测试"
    - "性能基准测试"
    - "安全渗透测试"

input_config:
  required_inputs:
    - name: "interaction_description"
      type: "yaml"
      description: "组件交互描述"
      template: "templates/interaction_template.yaml"
      spec: "docs/interaction_spec.md"
    
    - name: "seed_cases"
      type: "yaml"
      description: "种子测试用例"
      template: "templates/test_case_template.yaml"
      spec: "docs/testcase_spec.md"
      min_count: 1
  
  optional_inputs:
    - name: "skill_config"
      type: "yaml"
      description: "Skill全局配置"
      default: "config/skill_config.yaml"
    
    - name: "generation_limits"
      type: "yaml"
      description: "生成数量和优先级限制"
      default: "config/generation_limits.yaml"

output_config:
  output_directory: "output"
  output_files:
    - name: "test_cases.yaml"
      description: "生成的测试用例列表"
      format: "yaml"
      spec: "docs/testcase_spec.md"
    
    - name: "test_script.py"
      description: "pytest自动化测试脚本"
      format: "python"
      template: "templates/script_template.md"
    
    - name: "coverage_analysis.yaml"
      description: "覆盖维度分析"
      format: "yaml"
      spec: "docs/coverage_dimensions.md"
    
    - name: "generation_report.md"
      description: "生成报告"
      format: "markdown"

supported_components:
  any_component: true
  interaction_types:
    - "data_flow"
    - "state_sync"
    - "event_trigger"
    - "query_access"
    - "config_linkage"

quality_check:
  enabled: true
  check_items:
    - "用例完整性"
    - "步骤可执行性"
    - "断言有效性"
  quality_threshold:
    min_score: 0.8

extensions:
  custom_generalization: []
  custom_validation: []
  custom_generation: []